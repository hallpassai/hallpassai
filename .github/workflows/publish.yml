name: Publish to npm

on:
  push:
    tags:
      - "v*"
      - "ai-sdk-provider-v*"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Run full CLI and AI SDK provider test suites and package verification
        run: |
          npm test
          npm pack --dry-run
          npm --prefix packages/ai-sdk-provider test
          npm pack --dry-run ./packages/ai-sdk-provider
      - name: Publish with SLSA provenance on verified version tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cli_ver="$(node -p "require('./package.json').version")"
          sdk_ver="$(node -p "require('./packages/ai-sdk-provider/package.json').version")"
          if [ "${REF_TYPE}" != "tag" ]; then
            echo "Non-tag dispatch (${REF_NAME}) — running npm publish --dry-run only."
            npm publish --dry-run --access public
            (cd packages/ai-sdk-provider && npm publish --dry-run --access public)
            exit 0
          fi
          if [[ "${REF_NAME}" == ai-sdk-provider-v* ]]; then
            if [ "ai-sdk-provider-v${sdk_ver}" != "${REF_NAME}" ]; then
              echo "Tag ${REF_NAME} does not match packages/ai-sdk-provider/package.json version v${sdk_ver}" >&2
              exit 1
            fi
            cd packages/ai-sdk-provider
            npm publish --provenance --access public
          elif [[ "${REF_NAME}" == v* ]]; then
            if [ "v${cli_ver}" != "${REF_NAME}" ]; then
              echo "Tag ${REF_NAME} does not match package.json version v${cli_ver}" >&2
              exit 1
            fi
            npm publish --provenance --access public
          else
            echo "Unsupported release tag ${REF_NAME}" >&2
            exit 1
          fi
